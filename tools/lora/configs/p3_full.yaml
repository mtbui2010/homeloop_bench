# P3 full run: LoRA for the understand step on the whole P1 `inferable` training set (9,060 rows, TRAIN split gold goals,
# 3,512 tasks). Validation loss on the P1 val split (492 rows, 188 train-split tasks held out by task id). Same recipe as
# P2 (p2_small.yaml); changes: 2 epochs, evaluation / checkpoint every 100 steps (best by val loss + last kept),
# micro-batch 1 x grad_accum 8 per process as in P2 (the P3 smoke test with micro-batch 2 x 4 was slower: 15.8 s/step,
# 1,486 tokens/s, 23.9 GiB peak, against P2's 11.2 s/step, 2,021 tokens/s). <NAS> = the lab's NAS share.
# Run (data-parallel, 2 processes, effective batch 16, detached):
#   HOMELOOP_LORA_DIR=<NAS>/homeloop_lora HF_HOME=<NAS>/homeloop_lora/hf CUDA_VISIBLE_DEVICES=2,3 \
#     PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True nohup <venv>/bin/torchrun --standalone --nproc_per_node 2 \
#     ~/.claude/skills/lora-finetune/scripts/train_lora.py --config this.yaml > <NAS>/homeloop_lora/logs/p3_full_train.log 2>&1 &
# Resume after a stop: add --set resume_from_checkpoint=true (same world size).
model_path: ${HOMELOOP_LORA_DIR}/models/Qwen3-VL-8B-Instruct   # HF Qwen/Qwen3-VL-8B-Instruct @0c351dd
output_dir: ${HOMELOOP_LORA_DIR}/runs/p3_full
train_file: ${HOMELOOP_LORA_DIR}/data/understand_v1/inferable/train.jsonl
val_file: ${HOMELOOP_LORA_DIR}/data/understand_v1/inferable/val.jsonl
model_class: image_text_to_text      # full VL checkpoint; LoRA on the language layers only (vision frozen)
target_modules: 'model\.language_model\.layers\.\d+\.(self_attn\.(q|k|v|o)_proj|mlp\.(gate|up|down)_proj)'
max_len: 4096
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lr: 2.0e-4
scheduler: cosine
warmup_frac: 0.03
batch_size: 1
grad_accum: 8            # per process; 1 x 8 x 2 processes = 16 sequences per step, 567 steps per epoch
epochs: 2
eval_steps: 100
save_steps: 100
save_total_limit: 2      # with load_best_model_at_end: the best (by val loss) and the last checkpoint are kept
logging_steps: 1
gen_check_n: 5
gen_max_new_tokens: 400
seed: 0
gpu_mem_cap_gib: 28
